[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pmi-nowcast"
version = "0.1.0"
description = "PMI Nowcasting — 制造业景气度即时预测（方法论严谨的宏观 ML 管线）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
advanced = ["xgboost>=2.0", "shap>=0.44", "streamlit>=1.30"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
